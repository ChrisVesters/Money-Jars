query GetTransactions {
	getTransactions {
		__typename

		id
		date
		amount
		description

		... on PaymentTransaction {
			jar {
				id
				name
			}
			account {
				id
				name
			}
			counterparty
			direction
		}

		... on JarTransferTransaction {
			sourceJar {
				id
				name
			}
			targetJar {
				id
				name
			}
		}
	}
}

query QueryTransactions($req: TransactionQuery!) {
	queryTransactions(query: $req) {
		content {
			__typename

			id
			date
			amount
			description

			... on PaymentTransaction {
				jar {
					id
					name
				}
				account {
					id
					name
				}
				counterparty
				direction
			}

			... on JarTransferTransaction {
				sourceJar {
					id
					name
				}
				targetJar {
					id
					name
				}
			}
		}
		page
		size
		totalElements
	}
}
