query GetCategories {
	getCategories {
		id
		name
		description
		inUse
	}
}

mutation CreateCategory($req: UpdateCategory!) {
	createCategory(req: $req) {
		id
		name
		description
	}
}

mutation UpdateCategory($id: ID!, $req: UpdateCategory!) {
	updateCategory(id: $id, req: $req) {
		id
		name
		description
	}
}

mutation DeleteCategory($id: ID!) {
	deleteCategory(id: $id)
}
