query GetJars {
 	getJars {
		id
		name
		description
		balance
		goal

		transactions {
			__typename

			id
			date
			amount
			description

			... on PaymentTransaction {
				jar {
					id
					name
				}
				account {
					id
					name
				}
				counterparty
				direction
			}

			... on JarTransferTransaction {
				sourceJar {
					id
					name
				}
				targetJar {
					id
					name
				}
			}
		}
	}
}

mutation CreateJar($req: UpdateJar!) {
	createJar(req: $req) {
		id
		name
		description
		balance
	}
}

mutation UpdateJar($id: ID!, $req: UpdateJar!) {
	updateJar(id: $id, req: $req) {
		id
		name
		description
		balance
	}
}

mutation DeleteJar($id: ID!) {
	deleteJar(id: $id)
}
