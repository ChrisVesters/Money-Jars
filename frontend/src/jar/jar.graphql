query GetJars {
 	getJars {
		id
		name
		description
		balance
		goal
		inUse
	}
}

query GetJar($id: ID!, $req: TransactionQuery!) {
	getJar(id: $id) {
		id
		transactions(query: $req) {
			content {
				__typename

				id
				date
				amount
				description

				... on PaymentTransaction {
					jar {
						id
						name
					}
					account {
						id
						name
					}
					counterparty
					direction
				}

				... on JarTransferTransaction {
					sourceJar {
						id
						name
					}
					targetJar {
						id
						name
					}
				}
			}
			page
			size
			totalElements
		}
	}
}

mutation CreateJar($req: UpdateJar!) {
	createJar(req: $req) {
		id
		name
		description
		balance
	}
}

mutation UpdateJar($id: ID!, $req: UpdateJar!) {
	updateJar(id: $id, req: $req) {
		id
		name
		description
		balance
	}
}

mutation DeleteJar($id: ID!) {
	deleteJar(id: $id)
}
