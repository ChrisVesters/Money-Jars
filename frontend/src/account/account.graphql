query GetAccounts {
	getAccounts {
		id
		name
		description
		balance

		transactions {
			__typename

			id
			date
			amount
			description

			... on PaymentTransaction {
				counterparty
				direction
			}

			... on AccountTransferTransaction {
				sourceAccount {
					id
					name
				}
				targetAccount {
					id
					name
				}
			}
		}
	}
}

mutation CreateAccount($req: UpdateAccount!) {
	createAccount(req: $req) {
		id
		name
		description
		balance
	}
}

mutation UpdateAccount($id: ID!, $req: UpdateAccount!) {
	updateAccount(id: $id, req: $req) {
		id
		name
		description
		balance
	}
}

mutation DeleteAccount($id: ID!) {
	deleteAccount(id: $id)
}
